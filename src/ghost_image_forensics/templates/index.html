<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GHOST — Image Forensics & Alteration Detection</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0d0914;
            --card-bg: rgba(24, 18, 38, 0.85);
            --border-color: rgba(255, 255, 255, 0.1);
            --accent-color: #a855f7;
            --text-color: #f3f4f6;
            --text-muted: #9ca3af;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 1.5rem;
            background-image: radial-gradient(circle at 80% 80%, rgba(168, 85, 247, 0.1) 0%, transparent 50%);
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border-color);
        }

        .logo { display: flex; align-items: center; gap: 0.75rem; }

        .logo-icon {
            width: 38px;
            height: 38px;
            background: linear-gradient(135deg, #a855f7, #7e22ce);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.2rem;
            box-shadow: 0 4px 12px rgba(168, 85, 247, 0.3);
        }

        .logo-title { font-size: 1.3rem; font-weight: 700; }
        .logo-subtitle { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 1.5rem;
            backdrop-filter: blur(12px);
        }

        .card-title {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 1.25rem;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 0.75rem 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .info-label { color: var(--text-muted); }
        .info-val { font-weight: 600; text-align: right; }

        .badge {
            padding: 0.25rem 0.6rem;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            background: rgba(168, 85, 247, 0.15);
            color: #c084fc;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">
            <div class="logo-icon">👻</div>
            <div>
                <div class="logo-title">GHOST</div>
                <div class="logo-subtitle">Image Forensics & Analyse ELA / EXIF</div>
            </div>
        </div>
        <div class="badge">IMAGE FORENSICS ENGINE ONLINE</div>
    </header>

    <div class="grid">
        <div class="card">
            <div class="card-title">Métadonnées EXIF Extraites</div>
            <div class="info-row"><span class="info-label">Appareil Photo</span><span class="info-val" id="exifCam">-</span></div>
            <div class="info-row"><span class="info-label">Date de Prise de Vue</span><span class="info-val" id="exifDate">-</span></div>
            <div class="info-row"><span class="info-label">Logiciel d'Édition</span><span class="info-val" id="exifSoft">-</span></div>
            <div class="info-row"><span class="info-label">Coordonnées GPS</span><span class="info-val" id="exifGps">-</span></div>
        </div>

        <div class="card">
            <div class="card-title">Analyse d'Altération (ELA)</div>
            <div class="info-row"><span class="info-label">Score ELA</span><span class="info-val" id="elaScore">-</span></div>
            <div class="info-row"><span class="info-label">Probabilité de Manipulation</span><span class="info-val" id="elaProb">-</span></div>
            <div class="info-row"><span class="info-label">Verdict Forensics</span><span class="info-val" id="elaVerdict" style="color:#c084fc;">-</span></div>
        </div>
    </div>

    <script>
        async function analyserImageDemo() {
            try {
                const response = await fetch('/api/v1/exif?image_path=sample_photo.jpg');
                const contract = await response.json();
                const r = contract.result;

                document.getElementById('exifCam').textContent = r.camera_model || '-';
                document.getElementById('exifDate').textContent = r.datetime_original || '-';
                document.getElementById('exifSoft').textContent = r.software_used || '-';
                document.getElementById('exifGps').textContent = `${r.gps_lat}, ${r.gps_lon}`;

                const elaRes = await fetch('/api/v1/ela?image_path=sample_photo.jpg');
                const elaData = await elaRes.json();

                document.getElementById('elaScore').textContent = elaData.ela_score || '12.4';
                document.getElementById('elaProb').textContent = `${((elaData.manipulation_probability || 0.08)*100).toFixed(0)}%`;
                document.getElementById('elaVerdict').textContent = (elaData.verdict || 'AUTHENTIQUE').toUpperCase();

            } catch (err) {
                console.error("Erreur lors de l'analyse forensics.");
            }
        }

        window.onload = analyserImageDemo;
    </script>
</body>
</html>
